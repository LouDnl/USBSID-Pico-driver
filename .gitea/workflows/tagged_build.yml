# Gitea Actions copy of .github/workflows/tagged_build.yml (git.loudai.nl). Gitea runs
# .gitea/workflows/ and ignores .github/workflows/ when this directory exists.
# Differences: no macos-14 (no Apple Silicon runner), repositories under
# LouDnl/ on GitHub live under usbsid/ here, releases go through Gitea's API.

name: C/C++ driver tagged build

# Tag d<date> (e.g. d20261024) publishes a snapshot of the C/C++ driver: the
# same source archives as an official release, attached as a prerelease that
# is never marked latest. Not v*: that is release-native.yml. Not java-v*: the
# Java driver has its own tags and workflow, see release-java.yml.

on:
  push:
    tags:
      - 'd[0-9]*'   # a date, d20261024 and so on
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same platform builds and tests release-native.yml gates on. Its own
  # source archive packaging lives in its release job (v* tags only), so it
  # is not run here; the publish job below packages instead.
  build:
    name: Build
    uses: ./.gitea/workflows/build-native.yml

  publish_release:
    name: Publish tagged build
    runs-on: ubuntu-latest
    needs: build
    # job will only start if there is a new d tag
    if: startsWith(github.ref, 'refs/tags/d')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag name
        id: vars
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Package source archives
        run: bash test/ci/package.sh native "${{ steps.vars.outputs.tag }}" release

      - name: Generate release notes
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "**Commits in this tagged build:**" > release_notes.md
          # The tag before this one, Java tags included, or the whole history the first time round
          PREV=$(git tag --sort=-version:refname | grep -vx "$SOURCE_TAG" | head -n 1 || true)
          if [ -n "$PREV" ]; then
            git log "$PREV..HEAD" --oneline -- src libusbsiddrv-vice >> release_notes.md
          else
            git log --oneline -- src libusbsiddrv-vice >> release_notes.md
          fi
          cat release_notes.md

      - name: Create tagged build release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ steps.vars.outputs.tag }}
          TITLE: ${{ steps.vars.outputs.tag }} snapshot
          PRERELEASE: "true"
        run: |
          # Gitea's release API (the GitHub workflow uses a GitHub-only action).
          # Re-runs reuse the release of this tag and replace assets of the same name.
          set -euo pipefail
          auth=(-H "Authorization: token $TOKEN")
          id=$(curl -fsS "${auth[@]}" "$API/releases/tags/$TAG" 2>/dev/null \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' || true)
          if [ -z "$id" ]; then
            payload=$(TAG="$TAG" TITLE="$TITLE" PRE="$PRERELEASE" python3 -c '
          import json, os
          body = open("release_notes.md").read() if os.path.exists("release_notes.md") else ""
          print(json.dumps({"tag_name": os.environ["TAG"], "name": os.environ["TITLE"],
                            "body": body, "prerelease": os.environ["PRE"] == "true"}))')
            id=$(curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -X POST \
                   "$API/releases" -d "$payload" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi
          echo "release id $id for $TAG"
          shopt -s nullglob
          for f in release/*; do
            n=$(basename "$f")
            for old in $(curl -fsS "${auth[@]}" "$API/releases/$id/assets" \
                | python3 -c 'import json,sys; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"]==sys.argv[1]))' "$n"); do
              curl -fsS "${auth[@]}" -X DELETE "$API/releases/$id/assets/$old"
            done
            curl -fsS "${auth[@]}" -X POST -F "attachment=@$f" "$API/releases/$id/assets?name=$n" >/dev/null
            echo "uploaded $n"
          done
